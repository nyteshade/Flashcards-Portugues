name: FlashcardsPortuges
options:
  bundleIdPrefix: com.nyteshade
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true

# Top-level base settings are inherited by every target. Anything
# platform-specific (INFOPLIST_FILE, hardened runtime, entitlements)
# is overridden per target below.
settings:
  base:
    SWIFT_VERSION: "6.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.nyteshade.flashcards.portugues
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    DEAD_CODE_STRIPPING: YES
    SWIFT_STRICT_CONCURRENCY: minimal

packages:
  mlx-swift:
    url: https://github.com/ml-explore/mlx-swift.git
    from: 0.31.3
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm.git
    branch: main
  swift-huggingface:
    url: https://github.com/huggingface/swift-huggingface.git
    from: 0.9.0
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.0

schemes:
  FlashcardsPortuges:
    build:
      targets:
        FlashcardsPortuges: all
    run:
      config: Debug
    archive:
      config: Release
  FlashcardsPortugesIOS:
    build:
      targets:
        FlashcardsPortugesIOS: all
    run:
      config: Debug
    archive:
      config: Release
  FlashcardsPortugesIPad:
    build:
      targets:
        FlashcardsPortugesIPad: all
    run:
      config: Debug
    archive:
      config: Release

targets:
  FlashcardsPortuges:
    type: application
    platform: macOS
    sources:
      # macOS target excludes iOS-only sources. See
      # docs/ios-separation-plan.md for the full layout.
      - path: Sources/FlashcardsPortuges
        excludes:
          - "App/iOS/**"
          - "App/iPadOS/**"
          - "Views/iOS/**"
          - "Views/iPadOS/**"
          - "Resources/Prompts/**"
      - path: icons/Flashcards.icns
        buildPhase: resources
      - path: icons/StudyDeck.icns
        buildPhase: resources
      # Folder reference for Prompts so the Prompts/<scale>/ tree is
      # preserved verbatim in the bundle (xcodegen `resources:` block
      # builds a regular Group that flattens files; only `sources:`
      # supports `type: folder` for a real PBXFileReference folder).
      # PromptLoader's subdirectory: lookup depends on this.
      - path: Sources/FlashcardsPortuges/Resources/Prompts
        type: folder
        buildPhase: resources
    resources:
      - path: Sources/FlashcardsPortuges/Resources
        optional: true
        excludes:
          - "Prompts/**"
    info:
      path: Info.plist
      properties:
        CFBundleIconFile: Flashcards
        CFBundleIconName: Flashcards
        LSMultipleInstancesProhibited: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Flashcards Deck
            CFBundleTypeRole: Editor
            CFBundleTypeIconFile: StudyDeck
            CFBundleTypeExtensions:
              - flcd
            LSItemContentTypes:
              - com.nyteshade.flashcards.portugues.flcd
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.nyteshade.flashcards.portugues.flcd
            UTTypeDescription: Flashcards Deck
            UTTypeIconFile: StudyDeck
            UTTypeConformsTo:
              - public.json
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - flcd
              public.mime-type:
                - application/vnd.flashcards.deck+json
    settings:
      base:
        PRODUCT_NAME: FlashcardsPortuges
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        INFOPLIST_FILE: Info.plist
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: FlashcardsPortuges.entitlements
    dependencies:
      - package: mlx-swift
        product: MLX
      - package: mlx-swift
        product: MLXNN
      - package: mlx-swift
        product: MLXOptimizers
      - package: mlx-swift
        product: MLXRandom
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: mlx-swift-lm
        product: MLXHuggingFace
      - package: swift-huggingface
        product: HuggingFace
      - package: swift-transformers
        product: Tokenizers

  FlashcardsPortugesIOS:
    type: application
    platform: iOS
    sources:
      # iOS target excludes the macOS-only entry point + Settings scene.
      - path: Sources/FlashcardsPortuges
        excludes:
          - "App/macOS/**"
          - "App/iPadOS/**"
          - "Views/macOS/**"
          - "Views/iPadOS/**"
          - "Resources/Prompts/**"
      # Folder reference for Prompts (see macOS target for rationale).
      - path: Sources/FlashcardsPortuges/Resources/Prompts
        type: folder
        buildPhase: resources
    resources:
      - path: Sources/FlashcardsPortuges/Resources
        optional: true
        excludes:
          - "Prompts/**"
    info:
      path: Info-iOS.plist
      # xcodegen overwrites Info-iOS.plist on every `xcodegen
      # generate` from these properties. Manual edits to the .plist
      # file don't survive — declare keys here instead.
      properties:
        # Without UILaunchScreen, iOS treats the app as designed for
        # iPhone 8 and renders it in a letterboxed compatibility
        # canvas on every modern device.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_NAME: FlashcardsPortuges
        INFOPLIST_FILE: Info-iOS.plist
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: FlashcardsPortuges-iOS.entitlements
    dependencies:
      - package: mlx-swift
        product: MLX
      - package: mlx-swift
        product: MLXNN
      - package: mlx-swift
        product: MLXOptimizers
      - package: mlx-swift
        product: MLXRandom
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: mlx-swift-lm
        product: MLXHuggingFace
      - package: swift-huggingface
        product: HuggingFace
      - package: swift-transformers
        product: Tokenizers

  FlashcardsPortugesIPad:
    type: application
    platform: iOS
    sources:
      # iPadOS target — excludes iPhone views and macOS views.
      # Uses Views/iPadOS/ as its exclusive view layer.
      - path: Sources/FlashcardsPortuges
        excludes:
          - "App/macOS/**"
          - "App/iOS/**"
          - "Views/macOS/**"
          - "Views/iOS/**"
          - "Resources/Prompts/**"
      # Folder reference for Prompts (see macOS target for rationale).
      - path: Sources/FlashcardsPortuges/Resources/Prompts
        type: folder
        buildPhase: resources
    resources:
      - path: Sources/FlashcardsPortuges/Resources
        optional: true
        excludes:
          - "Prompts/**"
    info:
      path: Info-iPadOS.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_NAME: FlashcardsPortuges
        INFOPLIST_FILE: Info-iPadOS.plist
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "2"
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: FlashcardsPortuges-iOS.entitlements
    dependencies:
      - package: mlx-swift
        product: MLX
      - package: mlx-swift
        product: MLXNN
      - package: mlx-swift
        product: MLXOptimizers
      - package: mlx-swift
        product: MLXRandom
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: mlx-swift-lm
        product: MLXHuggingFace
      - package: swift-huggingface
        product: HuggingFace
      - package: swift-transformers
        product: Tokenizers
